<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interest Calculator</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #e3f2fd, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      min-height: 100vh;
    }
    .si-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
    }
    .si-container h2 {
      text-align: center;
      color: #1565c0;
      margin-bottom: 25px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 12px;
      color: #333;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      background-color: #1976d2;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s ease;
    }
    button:hover {
      background-color: #0d47a1;
    }
    .si-result {
      margin-top: 20px;
      padding: 15px;
      background: #e8f5e9;
      border-left: 5px solid #43a047;
      border-radius: 8px;
      font-size: 1.05rem;
      color: #1b5e20;
    }
    canvas {
      margin-top: 30px;
      max-height: 180px;
    }
  </style>
</head>
<body>
  <div class="si-container">
    <h2>Interest Calculator</h2>

    <label for="calculationType">Calculation Type:</label>
    <select id="calculationType">
      <option value="simple">Simple Interest</option>
      <option value="compound">Compound Interest</option>
    </select>

    <label for="frequency">Compounding Frequency (only for CI):</label>
    <select id="frequency">
      <option value="1">Annually</option>
      <option value="4">Quarterly</option>
      <option value="12">Monthly</option>
      <option value="365">Daily</option>
    </select>

    <label for="principal">Investment (₹):</label>
    <input type="number" id="principal" value="3000000">

    <label for="rate">Interest Rate (% per annum):</label>
    <input type="number" id="rate" value="6">

    <label for="time">Holding Period (in Months):</label>
    <input type="number" id="time" value="12">

    <button onclick="calculateInterest()">Calculate</button>

    <div class="si-result" id="siResult"></div>
    <canvas id="interestChart"></canvas>
  </div>

  <script>
    let chartInstance = null;

    function calculateInterest() {
      const principal = parseFloat(document.getElementById("principal").value);
      const rate = parseFloat(document.getElementById("rate").value);
      const months = parseFloat(document.getElementById("time").value);
      const type = document.getElementById("calculationType").value;
      const frequency = parseInt(document.getElementById("frequency").value);
      const years = months / 12;

      let interest = 0;
      let total = 0;
      let yearsToDouble = 0;

      if (type === 'simple') {
        interest = (principal * rate * years) / 100;
        total = principal + interest;
        yearsToDouble = 100 / rate;
      } else {
        total = principal * Math.pow((1 + (rate / 100) / frequency), frequency * years);
        interest = total - principal;
        yearsToDouble = Math.log(2) / (frequency * Math.log(1 + (rate / 100) / frequency));
      }

      document.getElementById("siResult").innerHTML = `
        Type: <strong>${type === 'simple' ? 'Simple Interest' : 'Compound Interest'}</strong><br>
        Compounding: <strong>${type === 'simple' ? 'N/A' : document.getElementById("frequency").selectedOptions[0].text}</strong><br>
        Interest Earned: <strong>₹${interest.toFixed(2)}</strong><br>
        Final Value: <strong>₹${total.toFixed(2)}</strong><br>
        Holding Period: <strong>${months} months (${years.toFixed(2)} years)</strong><br>
        Time to Double Money: <strong>${yearsToDouble.toFixed(2)} years</strong>
      `;

      const ctx = document.getElementById('interestChart').getContext('2d');

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Investment', 'Interest'],
          datasets: [{
            label: '₹ Value',
            data: [principal, interest],
            backgroundColor: ['#64b5f6', '#81c784'],
            barPercentage: 0.5,
            categoryPercentage: 0.5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                callback: function(value) {
                  return '₹' + value;
                }
              }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
